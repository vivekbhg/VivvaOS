<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - VivvaAPI</title>
    <style>
        :root { --primary: #6C3CE1; --bg: #0a0a0f; --card: #13131a; --border: #1e1e2a; --text: #e4e4e7; --muted: #71717a; --green: #22c55e; --red: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }
        .container { max-width: 900px; margin: 0 auto; padding: 0 24px; }
        nav { border-bottom: 1px solid var(--border); padding: 16px 0; }
        nav .container { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.4rem; font-weight: 700; color: var(--primary); text-decoration: none; }
        nav a { color: var(--muted); text-decoration: none; margin-left: 24px; font-size: 0.9rem; }
        h1 { margin: 40px 0 24px; font-size: 1.8rem; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
        .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
        .stat-card .label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-card .value { font-size: 1.8rem; font-weight: 700; margin-top: 4px; }
        .stat-card .sub { font-size: 0.8rem; color: var(--muted); }
        .section { margin-bottom: 32px; }
        .section h2 { font-size: 1.2rem; margin-bottom: 16px; }
        .key-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .key-name { font-weight: 600; }
        .key-value { font-family: monospace; font-size: 0.85rem; color: var(--muted); }
        .badge { padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
        .badge-free { background: #1e293b; color: #94a3b8; }
        .badge-pro { background: #312e81; color: #a78bfa; }
        .badge-business { background: #164e63; color: #22d3ee; }
        .btn { padding: 10px 20px; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 0.85rem; cursor: pointer; border: none; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-sm { padding: 6px 14px; font-size: 0.8rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
        th { color: var(--muted); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; }
        .empty { text-align: center; padding: 40px; color: var(--muted); }
        #login-section, #dashboard-section { display: none; }
        input { background: var(--card); border: 1px solid var(--border); padding: 10px 14px; border-radius: 8px; color: var(--text); font-size: 0.9rem; width: 100%; margin-bottom: 12px; }
        .form-card { max-width: 400px; margin: 80px auto; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 32px; }
        .form-card h2 { margin-bottom: 20px; }
        .toggle { color: var(--primary); cursor: pointer; font-size: 0.85rem; }
        .msg { padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 0.85rem; }
        .msg-success { background: #052e16; color: var(--green); border: 1px solid #166534; }
        .msg-error { background: #2a0a0a; color: var(--red); border: 1px solid #7f1d1d; }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="/" class="logo">VivvaAPI</a>
            <div>
                <a href="/docs">API Docs</a>
                <a href="/#pricing">Pricing</a>
                <a href="#" onclick="logout()">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Login/Register -->
        <div id="login-section">
            <div class="form-card">
                <h2 id="form-title">Sign In</h2>
                <div id="form-msg"></div>
                <input type="email" id="email" placeholder="Email">
                <input type="password" id="password" placeholder="Password">
                <button class="btn btn-primary" style="width:100%" onclick="submitAuth()">Submit</button>
                <p style="margin-top:12px;text-align:center">
                    <span id="toggle-text">Don't have an account?</span>
                    <span class="toggle" onclick="toggleMode()"><span id="toggle-link">Register</span></span>
                </p>
            </div>
        </div>

        <!-- Dashboard -->
        <div id="dashboard-section">
            <h1>Dashboard</h1>
            <div class="stats">
                <div class="stat-card">
                    <div class="label">Plan</div>
                    <div class="value" id="plan-name">Free</div>
                    <div class="sub"><a href="/#pricing" style="color:var(--primary);text-decoration:none">Upgrade</a></div>
                </div>
                <div class="stat-card">
                    <div class="label">Requests Today</div>
                    <div class="value" id="requests-today">0</div>
                    <div class="sub" id="requests-limit">of 100</div>
                </div>
                <div class="stat-card">
                    <div class="label">API Keys</div>
                    <div class="value" id="key-count">0</div>
                </div>
            </div>

            <div class="section">
                <h2>Your API Keys</h2>
                <div id="keys-list"></div>
            </div>

            <div class="section" id="new-key-msg" style="display:none">
                <div class="msg msg-success">
                    <strong>Save this key now!</strong> You won't be able to see it again.<br>
                    <code id="new-key-value" style="font-size:1rem;word-break:break-all"></code>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isLogin = true;
        const API = '';

        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('form-title').textContent = isLogin ? 'Sign In' : 'Create Account';
            document.getElementById('toggle-text').textContent = isLogin ? "Don't have an account?" : "Already have an account?";
            document.getElementById('toggle-link').textContent = isLogin ? 'Register' : 'Sign In';
        }

        async function submitAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const endpoint = isLogin ? '/auth/login' : '/auth/register';

            try {
                const res = await fetch(API + endpoint, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password})
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Request failed');

                localStorage.setItem('token', data.token);
                localStorage.setItem('plan', data.plan);

                if (data.api_key) {
                    localStorage.setItem('new_key', data.api_key);
                }
                if (data.api_keys) {
                    localStorage.setItem('api_keys', JSON.stringify(data.api_keys));
                }
                showDashboard();
            } catch (e) {
                document.getElementById('form-msg').innerHTML = `<div class="msg msg-error">${e.message}</div>`;
            }
        }

        function showDashboard() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';

            const plan = localStorage.getItem('plan') || 'free';
            const limits = {free: 100, pro: 10000, business: 100000};

            document.getElementById('plan-name').textContent = plan.charAt(0).toUpperCase() + plan.slice(1);
            document.getElementById('requests-limit').textContent = `of ${limits[plan]?.toLocaleString() || 100}`;

            const keys = JSON.parse(localStorage.getItem('api_keys') || '[]');
            document.getElementById('key-count').textContent = keys.length || 1;

            let total = 0;
            const keysList = document.getElementById('keys-list');
            keysList.innerHTML = '';
            keys.forEach(k => {
                total += k.requests_today || 0;
                keysList.innerHTML += `<div class="key-card"><div><div class="key-name">${k.name}</div><div class="key-value">${k.key}</div></div><div>${k.requests_today || 0} reqs today</div></div>`;
            });
            document.getElementById('requests-today').textContent = total;

            const newKey = localStorage.getItem('new_key');
            if (newKey) {
                document.getElementById('new-key-msg').style.display = 'block';
                document.getElementById('new-key-value').textContent = newKey;
                localStorage.removeItem('new_key');
            }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        // Init
        if (localStorage.getItem('token')) {
            showDashboard();
        } else {
            document.getElementById('login-section').style.display = 'block';
        }
    </script>
</body>
</html>
